<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Faculty Login | Student Management System</title>

    <link rel="stylesheet" href="css/style.css" />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }

      .login-box {
        background: #111827;
        border: 1px solid #7c3aed;
        border-radius: 16px;
        padding: 35px;
        box-shadow: 0 0 25px rgba(124, 58, 237, 0.25);
      }

      .login-box h1 {
        text-align: center;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #9ca3af;
        margin-bottom: 30px;
      }

      .login-box label {
        display: block;
        margin-top: 15px;
        margin-bottom: 7px;
      }

      .login-box input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #374151;
        border-radius: 8px;
        background: #1f2937;
        color: white;
        outline: none;
        font-size: 14px;
      }

      .login-box input:focus {
        border-color: #7c3aed;
      }

      .login-button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #7c3aed;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      .login-button:hover {
        background: #6d28d9;
      }

      #loginMessage {
        text-align: center;
        margin-top: 15px;
        min-height: 20px;
      }

      .login-footer {
        text-align: center;
        margin-top: 25px;
        color: #9ca3af;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="login-box">
        <h1>Faculty Login</h1>

        <p class="subtitle">Student Management System</p>

        <form id="facultyLoginForm">
          <label for="username">Username / Email</label>

          <input
            type="text"
            id="username"
            placeholder="Enter username or email"
            required
          />

          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          />

          <button type="submit" class="login-button">Login</button>

          <p id="loginMessage"></p>
        </form>

        <div class="login-footer">© 2026 Student Management System</div>
      </div>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:5000";

      document
        .getElementById("facultyLoginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const username = document.getElementById("username").value.trim();

          const password = document.getElementById("password").value;

          const message = document.getElementById("loginMessage");

          message.textContent = "Logging in...";
          message.style.color = "#a78bfa";

          try {
            const response = await fetch(API_URL + "/api/auth/login", {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                username: username,
                password: password,
                role: "faculty",
              }),
            });

            const data = await response.json();

            if (!response.ok) {
              message.textContent =
                data.message || "Invalid username or password.";

              message.style.color = "#ef4444";

              return;
            }

            localStorage.setItem("isLoggedIn", "true");

            localStorage.setItem("userRole", "faculty");

            localStorage.setItem("facultyName", data.name || username);

            localStorage.setItem("facultyId", data.id || "");

            message.textContent = "Login successful!";

            message.style.color = "#10b981";

            setTimeout(function () {
              window.location.href = "faculty-dashboard.html";
            }, 700);
          } catch (error) {
            console.error("Faculty login error:", error);

            message.textContent = "Unable to connect to server.";

            message.style.color = "#ef4444";
          }
        });
    </script>
  </body>
</html>
